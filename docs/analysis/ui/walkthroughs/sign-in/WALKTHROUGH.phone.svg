<circle cx="205" cy="64" r="3.5" fill="#9aa1ad"/>
<path d="M205,64 L205,100" fill="none" stroke="#9aa1ad" stroke-width="1.6" marker-end="url(#arrow-line)"/>
<rect x="80" y="100" width="250" height="145" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="124" font-size="12" font-weight="bold" fill="#6b7385">01</text>
<text x="92" y="145" font-size="14" font-weight="bold" fill="#1d2330">Go to Pot Tracker</text>
<text x="92" y="169" font-size="12" fill="#1d2330">The saver goes to Pot Tracker. They</text>
<text x="92" y="185" font-size="12" fill="#1d2330">are not signed in, so it shows only</text>
<text x="92" y="201" font-size="12" fill="#1d2330">the sign-in: nothing of anyone's</text>
<text x="92" y="217" font-size="12" fill="#1d2330">pots is on the screen until they</text>
<text x="92" y="233" font-size="12" fill="#1d2330">have identified themselves.</text>
<rect x="80" y="372" width="250" height="209" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="396" font-size="12" font-weight="bold" fill="#6b7385">02</text>
<text x="92" y="417" font-size="14" font-weight="bold" fill="#1d2330">Identify themselves</text>
<text x="92" y="441" font-size="12" fill="#1d2330">The saver gives their email address</text>
<text x="92" y="457" font-size="12" fill="#1d2330">and password, and signs in. The</text>
<text x="92" y="473" font-size="12" fill="#1d2330">password is typed and sent, never</text>
<text x="92" y="489" font-size="12" fill="#1d2330">held by the UI.</text>
<rect x="410" y="372" width="250" height="209" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="422" y="396" font-size="12" font-weight="bold" fill="#6b7385">02a</text>
<text x="422" y="417" font-size="14" font-weight="bold" fill="#1d2330">Choose Google</text>
<text x="422" y="441" font-size="12" fill="#1d2330">The saver chooses to identify</text>
<text x="422" y="457" font-size="12" fill="#1d2330">themselves with their Google</text>
<text x="422" y="473" font-size="12" fill="#1d2330">account. Google's own page is not</text>
<text x="422" y="489" font-size="12" fill="#1d2330">this UI's, so the step shows where</text>
<text x="422" y="505" font-size="12" fill="#1d2330">the saver leaves from; they come</text>
<text x="422" y="521" font-size="12" fill="#1d2330">back signed in.</text>
<rect x="740" y="372" width="250" height="209" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="752" y="396" font-size="12" font-weight="bold" fill="#6b7385">02b</text>
<text x="752" y="417" font-size="14" font-weight="bold" fill="#1d2330">Cannot be identified</text>
<text x="752" y="441" font-size="12" fill="#1d2330">Pot Tracker cannot identify the</text>
<text x="752" y="457" font-size="12" fill="#1d2330">saver from what they gave: the</text>
<text x="752" y="473" font-size="12" fill="#1d2330">password is wrong, or the address,</text>
<text x="752" y="489" font-size="12" fill="#1d2330">or the Google account they came back</text>
<text x="752" y="505" font-size="12" fill="#1d2330">with, is not one of its users. They</text>
<text x="752" y="521" font-size="12" fill="#1d2330">are told so without being told</text>
<text x="752" y="537" font-size="12" fill="#1d2330">which, and offered signing up. An</text>
<text x="752" y="553" font-size="12" fill="#1d2330">address they typed is kept; the</text>
<text x="752" y="569" font-size="12" fill="#1d2330">password is not.</text>
<rect x="1070" y="372" width="250" height="209" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="1082" y="396" font-size="12" font-weight="bold" fill="#6b7385">02c</text>
<text x="1082" y="417" font-size="14" font-weight="bold" fill="#1d2330">Reset a forgotten password</text>
<text x="1082" y="441" font-size="12" fill="#1d2330">The saver has forgotten their</text>
<text x="1082" y="457" font-size="12" fill="#1d2330">password. They give their email</text>
<text x="1082" y="473" font-size="12" fill="#1d2330">address and are sent a link, told</text>
<text x="1082" y="489" font-size="12" fill="#1d2330">only that one has been sent if the</text>
<text x="1082" y="505" font-size="12" fill="#1d2330">address has an account. Following</text>
<text x="1082" y="521" font-size="12" fill="#1d2330">the link from their email, they</text>
<text x="1082" y="537" font-size="12" fill="#1d2330">choose a new password, and are back</text>
<text x="1082" y="553" font-size="12" fill="#1d2330">at signing in.</text>
<rect x="80" y="747" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="771" font-size="12" font-weight="bold" fill="#6b7385">03 · end</text>
<text x="92" y="792" font-size="14" font-weight="bold" fill="#1d2330">See where their pots stand</text>
<text x="92" y="816" font-size="12" fill="#1d2330">The saver is signed in, and sees an</text>
<text x="92" y="832" font-size="12" fill="#1d2330">overview of their pots: each one's</text>
<text x="92" y="848" font-size="12" fill="#1d2330">value and when that was, and what</text>
<text x="92" y="864" font-size="12" fill="#1d2330">they add up to. Each pot carries its</text>
<text x="92" y="880" font-size="12" fill="#1d2330">own colour, which it keeps wherever</text>
<text x="92" y="896" font-size="12" fill="#1d2330">it is shown.</text>
<text x="92" y="920" font-size="12" font-style="italic" fill="#1d2330">End: the saver is signed in, and</text>
<text x="92" y="936" font-size="12" font-style="italic" fill="#1d2330">sees where their pots stand.</text>
<rect x="410" y="747" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="422" y="771" font-size="12" font-weight="bold" fill="#6b7385">03a · end</text>
<text x="422" y="792" font-size="14" font-weight="bold" fill="#1d2330">Start with no pots</text>
<text x="422" y="816" font-size="12" fill="#1d2330">The saver has no pots yet, so there</text>
<text x="422" y="832" font-size="12" fill="#1d2330">is nothing to add up. They are</text>
<text x="422" y="848" font-size="12" fill="#1d2330">offered the two ways to start, as on</text>
<text x="422" y="864" font-size="12" fill="#1d2330">signing up: finding their pensions,</text>
<text x="422" y="880" font-size="12" fill="#1d2330">and adding an investment portfolio.</text>
<text x="422" y="904" font-size="12" font-style="italic" fill="#1d2330">End: the saver is signed in, and</text>
<text x="422" y="920" font-size="12" font-style="italic" fill="#1d2330">offered the two ways to start.</text>
<rect x="740" y="747" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="752" y="771" font-size="12" font-weight="bold" fill="#6b7385">03b · end</text>
<text x="752" y="792" font-size="14" font-weight="bold" fill="#1d2330">See a value that is not up</text>
<text x="752" y="811" font-size="14" font-weight="bold" fill="#1d2330">to date</text>
<text x="752" y="835" font-size="12" fill="#1d2330">One provider could not be reached,</text>
<text x="752" y="851" font-size="12" fill="#1d2330">so one pot's value could not be</text>
<text x="752" y="867" font-size="12" fill="#1d2330">brought up to date. It is shown as</text>
<text x="752" y="883" font-size="12" fill="#1d2330">the value last known, and when that</text>
<text x="752" y="899" font-size="12" fill="#1d2330">was, and the overview says so. The</text>
<text x="752" y="915" font-size="12" fill="#1d2330">total includes it as last known.</text>
<text x="752" y="939" font-size="12" font-style="italic" fill="#1d2330">End: the saver is signed in, and</text>
<text x="752" y="955" font-size="12" font-style="italic" fill="#1d2330">knows which value is not up to date.</text>
<text x="205" y="312.5" font-size="12" text-anchor="middle" fill="#1f77b4" stroke="#ffffff" stroke-width="3" paint-order="stroke">Types their email address</text>
<text x="373.25" y="285" font-size="12" text-anchor="middle" fill="#1f77b4" stroke="#ffffff" stroke-width="3" paint-order="stroke">Chooses Google</text>
<text x="719.5" y="298" font-size="12" text-anchor="middle" fill="#1f77b4" stroke="#ffffff" stroke-width="3" paint-order="stroke">Has forgotten their password</text>
<text x="205" y="668" font-size="12" text-anchor="middle" fill="#d62728" stroke="#ffffff" stroke-width="3" paint-order="stroke">Pot Tracker identifies them</text>
<text x="450.625" y="311" font-size="12" text-anchor="middle" fill="#d62728" stroke="#ffffff" stroke-width="3" paint-order="stroke">Pot Tracker cannot identify them</text>
<text x="370" y="621" font-size="12" text-anchor="middle" fill="#d62728" stroke="#ffffff" stroke-width="3" paint-order="stroke">Identified, with no pots yet</text>
<text x="727.8" y="634" font-size="12" text-anchor="middle" fill="#d62728" stroke="#ffffff" stroke-width="3" paint-order="stroke">Identified, but a pot could not b…</text>
<text x="370" y="647" font-size="12" text-anchor="middle" fill="#2ca02c" stroke="#ffffff" stroke-width="3" paint-order="stroke">Comes back from Google, identified</text>
<text x="706.5" y="324" font-size="12" text-anchor="middle" fill="#2ca02c" stroke="#ffffff" stroke-width="3" paint-order="stroke">Comes back from Google, not ident…</text>
<text x="535" y="668" font-size="12" text-anchor="middle" fill="#2ca02c" stroke="#ffffff" stroke-width="3" paint-order="stroke">Comes back identified, with no po…</text>
<text x="762.825" y="660" font-size="12" text-anchor="middle" fill="#2ca02c" stroke="#ffffff" stroke-width="3" paint-order="stroke">Comes back identified, but a pot…</text>
<text x="366.9" y="673" font-size="12" text-anchor="middle" fill="#9467bd" stroke="#ffffff" stroke-width="3" paint-order="stroke">Tries again</text>
<text x="716.25" y="686" font-size="12" text-anchor="middle" fill="#9467bd" stroke="#ffffff" stroke-width="3" paint-order="stroke">Tries Google</text>
<text x="1010" y="699" font-size="12" text-anchor="middle" fill="#8c564b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Saves the new password and signs…</text>
<text x="199" y="68" font-size="12" text-anchor="end" fill="#6b7385" stroke="#ffffff" stroke-width="3" paint-order="stroke">Start</text>
</g>
</svg>
