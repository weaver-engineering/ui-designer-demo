<circle cx="198.5" cy="64" r="3.5" fill="#9aa1ad"/>
<path d="M198.5,64 L198.5,100" fill="none" stroke="#9aa1ad" stroke-width="1.6" marker-end="url(#arrow-line)"/>
<rect x="80" y="100" width="250" height="185" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="124" font-size="12" font-weight="bold" fill="#6b7385">01</text>
<text x="92" y="145" font-size="14" font-weight="bold" fill="#1d2330">Choose a possible match</text>
<text x="92" y="169" font-size="12" fill="#1d2330">A possible match waits for the saver</text>
<text x="92" y="185" font-size="12" fill="#1d2330">on the overview, above their pots,</text>
<text x="92" y="201" font-size="12" fill="#1d2330">as it does in the search that found</text>
<text x="92" y="217" font-size="12" fill="#1d2330">it. They choose it, and see what the</text>
<text x="92" y="233" font-size="12" fill="#1d2330">provider has told them: its name,</text>
<text x="92" y="249" font-size="12" fill="#1d2330">and why it is not sure the pension</text>
<text x="92" y="265" font-size="12" fill="#1d2330">is theirs.</text>
<rect x="410" y="100" width="250" height="185" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="422" y="124" font-size="12" font-weight="bold" fill="#6b7385">01a · end</text>
<text x="422" y="145" font-size="14" font-weight="bold" fill="#1d2330">Say it is not theirs</text>
<text x="422" y="169" font-size="12" fill="#1d2330">The saver knows the pension is not</text>
<text x="422" y="185" font-size="12" fill="#1d2330">theirs, and says so. The possible</text>
<text x="422" y="201" font-size="12" fill="#1d2330">match is dropped, the provider is</text>
<text x="422" y="217" font-size="12" fill="#1d2330">told, and it is gone from the</text>
<text x="422" y="233" font-size="12" fill="#1d2330">overview.</text>
<text x="422" y="257" font-size="12" font-style="italic" fill="#1d2330">End: the possible match is dropped</text>
<text x="422" y="273" font-size="12" font-style="italic" fill="#1d2330">and the provider told.</text>
<rect x="80" y="385" width="250" height="244" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="409" font-size="12" font-weight="bold" fill="#6b7385">02</text>
<text x="92" y="430" font-size="14" font-weight="bold" fill="#1d2330">Be asked what the provider</text>
<text x="92" y="449" font-size="14" font-weight="bold" fill="#1d2330">needs</text>
<text x="92" y="473" font-size="12" fill="#1d2330">The saver claims it, and is asked</text>
<text x="92" y="489" font-size="12" fill="#1d2330">for what the provider needs to be</text>
<text x="92" y="505" font-size="12" fill="#1d2330">sure. The provider decides what that</text>
<text x="92" y="521" font-size="12" fill="#1d2330">is: here the employer they worked</text>
<text x="92" y="537" font-size="12" fill="#1d2330">for and when, the address they lived</text>
<text x="92" y="553" font-size="12" fill="#1d2330">at then, and a membership number if</text>
<text x="92" y="569" font-size="12" fill="#1d2330">they have one. They are told what</text>
<text x="92" y="585" font-size="12" fill="#1d2330">they give goes to that provider</text>
<text x="92" y="601" font-size="12" fill="#1d2330">only, and Pot Tracker does not keep</text>
<text x="92" y="617" font-size="12" fill="#1d2330">it.</text>
<rect x="410" y="385" width="250" height="244" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="422" y="409" font-size="12" font-weight="bold" fill="#6b7385">02a · end</text>
<text x="422" y="430" font-size="14" font-weight="bold" fill="#1d2330">Leave it for now</text>
<text x="422" y="454" font-size="12" fill="#1d2330">The saver does not have what the</text>
<text x="422" y="470" font-size="12" fill="#1d2330">provider asks for to hand, and</text>
<text x="422" y="486" font-size="12" fill="#1d2330">leaves it. The possible match waits</text>
<text x="422" y="502" font-size="12" fill="#1d2330">for them, and is still on the</text>
<text x="422" y="518" font-size="12" fill="#1d2330">overview when they next sign in.</text>
<text x="422" y="542" font-size="12" font-style="italic" fill="#1d2330">End: the possible match waits for</text>
<text x="422" y="558" font-size="12" font-style="italic" fill="#1d2330">the saver.</text>
<rect x="80" y="730" width="250" height="132" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="754" font-size="12" font-weight="bold" fill="#6b7385">03</text>
<text x="92" y="775" font-size="14" font-weight="bold" fill="#1d2330">Give what they know</text>
<text x="92" y="799" font-size="12" fill="#1d2330">The saver gives the employer, when</text>
<text x="92" y="815" font-size="12" fill="#1d2330">they worked there and their address</text>
<text x="92" y="831" font-size="12" fill="#1d2330">then, and sends it to the provider.</text>
<rect x="410" y="730" width="250" height="132" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="422" y="754" font-size="12" font-weight="bold" fill="#6b7385">03a</text>
<text x="422" y="775" font-size="14" font-weight="bold" fill="#1d2330">Not know the membership</text>
<text x="422" y="794" font-size="14" font-weight="bold" fill="#1d2330">number</text>
<text x="422" y="818" font-size="12" fill="#1d2330">The saver does not know their</text>
<text x="422" y="834" font-size="12" fill="#1d2330">membership number. They say so, and</text>
<text x="422" y="850" font-size="12" fill="#1d2330">send the rest.</text>
<rect x="80" y="962" width="250" height="180" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="986" font-size="12" font-weight="bold" fill="#6b7385">04</text>
<text x="92" y="1007" font-size="14" font-weight="bold" fill="#1d2330">Be told the provider is</text>
<text x="92" y="1026" font-size="14" font-weight="bold" fill="#1d2330">checking</text>
<text x="92" y="1050" font-size="12" fill="#1d2330">The saver is told the provider is</text>
<text x="92" y="1066" font-size="12" fill="#1d2330">checking, and when it says it will</text>
<text x="92" y="1082" font-size="12" fill="#1d2330">answer, typically within ten working</text>
<text x="92" y="1098" font-size="12" fill="#1d2330">days. They need not wait: back on</text>
<text x="92" y="1114" font-size="12" fill="#1d2330">the overview the possible match says</text>
<text x="92" y="1130" font-size="12" fill="#1d2330">it is being checked, and until when.</text>
<rect x="80" y="1295" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="92" y="1319" font-size="12" font-weight="bold" fill="#6b7385">05 · end</text>
<text x="92" y="1340" font-size="14" font-weight="bold" fill="#1d2330">See it confirmed as theirs</text>
<text x="92" y="1364" font-size="12" fill="#1d2330">The provider confirms the pension is</text>
<text x="92" y="1380" font-size="12" fill="#1d2330">the saver's, and shares it. They are</text>
<text x="92" y="1396" font-size="12" fill="#1d2330">told so, and it is one of their</text>
<text x="92" y="1412" font-size="12" fill="#1d2330">pots, with its value, marked as</text>
<text x="92" y="1428" font-size="12" fill="#1d2330">found by the search. The possible</text>
<text x="92" y="1444" font-size="12" fill="#1d2330">match is gone.</text>
<text x="92" y="1468" font-size="12" font-style="italic" fill="#1d2330">End: the pension is one of the</text>
<text x="92" y="1484" font-size="12" font-style="italic" fill="#1d2330">saver's pots.</text>
<rect x="410" y="1295" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="422" y="1319" font-size="12" font-weight="bold" fill="#6b7385">05a</text>
<text x="422" y="1340" font-size="14" font-weight="bold" fill="#1d2330">Answer a further question</text>
<text x="422" y="1364" font-size="12" fill="#1d2330">The provider needs more, and asks a</text>
<text x="422" y="1380" font-size="12" fill="#1d2330">further question: here, to confirm</text>
<text x="422" y="1396" font-size="12" fill="#1d2330">when the saver left. They are told,</text>
<text x="422" y="1412" font-size="12" fill="#1d2330">and answer it, and the provider</text>
<text x="422" y="1428" font-size="12" fill="#1d2330">checks again.</text>
<rect x="740" y="1295" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="752" y="1319" font-size="12" font-weight="bold" fill="#6b7385">05b · end</text>
<text x="752" y="1340" font-size="14" font-weight="bold" fill="#1d2330">Be told it could not be</text>
<text x="752" y="1359" font-size="14" font-weight="bold" fill="#1d2330">matched</text>
<text x="752" y="1383" font-size="12" fill="#1d2330">The provider cannot match the</text>
<text x="752" y="1399" font-size="12" fill="#1d2330">pension to the saver from what they</text>
<text x="752" y="1415" font-size="12" fill="#1d2330">gave. They are told so, and why, as</text>
<text x="752" y="1431" font-size="12" fill="#1d2330">the provider says, and may try again</text>
<text x="752" y="1447" font-size="12" fill="#1d2330">with different details, such as</text>
<text x="752" y="1463" font-size="12" fill="#1d2330">another address, or leave it.</text>
<text x="752" y="1487" font-size="12" font-style="italic" fill="#1d2330">End: the possible match waits for</text>
<text x="752" y="1503" font-size="12" font-style="italic" fill="#1d2330">the saver.</text>
<rect x="1070" y="1295" width="250" height="220" rx="6" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="1082" y="1319" font-size="12" font-weight="bold" fill="#6b7385">05c · end</text>
<text x="1082" y="1340" font-size="14" font-weight="bold" fill="#1d2330">Be told the provider is late</text>
<text x="1082" y="1364" font-size="12" fill="#1d2330">The provider has not answered by</text>
<text x="1082" y="1380" font-size="12" fill="#1d2330">when it said. The possible match on</text>
<text x="1082" y="1396" font-size="12" fill="#1d2330">the overview says it is late, and on</text>
<text x="1082" y="1412" font-size="12" fill="#1d2330">the claim the saver may remind the</text>
<text x="1082" y="1428" font-size="12" fill="#1d2330">provider, or leave it to answer in</text>
<text x="1082" y="1444" font-size="12" fill="#1d2330">its own time.</text>
<text x="1082" y="1468" font-size="12" font-style="italic" fill="#1d2330">End: the claim waits on the</text>
<text x="1082" y="1484" font-size="12" font-style="italic" fill="#1d2330">provider.</text>
<text x="205" y="324" font-size="12" text-anchor="middle" fill="#1f77b4" stroke="#ffffff" stroke-width="3" paint-order="stroke">Claims it</text>
<text x="373.25" y="46" font-size="12" text-anchor="middle" fill="#1f77b4" stroke="#ffffff" stroke-width="3" paint-order="stroke">Knows it is not theirs</text>
<text x="205" y="683.5" font-size="12" text-anchor="middle" fill="#2ca02c" stroke="#ffffff" stroke-width="3" paint-order="stroke">Gives what they know</text>
<text x="376.5" y="331" font-size="12" text-anchor="middle" fill="#2ca02c" stroke="#ffffff" stroke-width="3" paint-order="stroke">Doesn't have it to hand</text>
<text x="205" y="901" font-size="12" text-anchor="middle" fill="#8c564b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Sends it</text>
<text x="424.05" y="669" font-size="12" text-anchor="middle" fill="#8c564b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Doesn't know their membership num…</text>
<text x="376.5" y="908" font-size="12" text-anchor="middle" fill="#e377c2" stroke="#ffffff" stroke-width="3" paint-order="stroke">Sends the rest</text>
<text x="205" y="1268.4" font-size="12" text-anchor="middle" fill="#17a2b8" stroke="#ffffff" stroke-width="3" paint-order="stroke">The provider confirms it is theirs</text>
<text x="419.82500000000005" y="1182" font-size="12" text-anchor="middle" fill="#17a2b8" stroke="#ffffff" stroke-width="3" paint-order="stroke">The provider asks something more</text>
<text x="651.875" y="1195" font-size="12" text-anchor="middle" fill="#17a2b8" stroke="#ffffff" stroke-width="3" paint-order="stroke">The provider cannot match it</text>
<text x="1002.2" y="1208" font-size="12" text-anchor="middle" fill="#17a2b8" stroke="#ffffff" stroke-width="3" paint-order="stroke">The provider does not answer in t…</text>
<text x="386.25" y="1221" font-size="12" text-anchor="middle" fill="#ff7f0e" stroke="#ffffff" stroke-width="3" paint-order="stroke">Sends the answer</text>
<text x="694.8" y="1234" font-size="12" text-anchor="middle" fill="#4a5162" stroke="#ffffff" stroke-width="3" paint-order="stroke">Tries again with a different addr…</text>
<text x="1015.2" y="1247" font-size="12" text-anchor="middle" fill="#1f77b4" stroke="#ffffff" stroke-width="3" paint-order="stroke">Reminds the provider</text>
<text x="192.5" y="68" font-size="12" text-anchor="end" fill="#6b7385" stroke="#ffffff" stroke-width="3" paint-order="stroke">Start</text>
</g>
</svg>
