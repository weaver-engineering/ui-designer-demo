<path d="M218,730 L218,673 L535,673 L535,730" fill="none" stroke="#8c564b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-p4)"/>
<path d="M535,862 L535,912 L218,912 L218,962" fill="none" stroke="#e377c2" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-p5)"/>
