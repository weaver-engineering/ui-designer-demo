<rect width="1312" height="1513" fill="#ffffff"/>
<g transform="translate(-24,-18)">
<path d="M205,285 L205,385" fill="none" stroke="#1f77b4" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-p0)"/>
